# Nginx config for the static build in `dist/`, as deployed to danmesko.com.
#
# Lives on the server at /etc/nginx/sites-available/website, symlinked into
# sites-enabled. deploy.sh only ships `dist/`, so edits here have to be copied
# to the server by hand, followed by `sudo nginx -t && sudo systemctl reload
# nginx`.
#
# Cloudflare sits in front with SSL mode Full (strict) and proxies every
# request, which is why only danmesko.com appears below: www.danmesko.com and
# danielmesko.com are 301'd to it by redirect rules at Cloudflare's edge and
# never reach this server.
#
# The site is a single page, so `try_files ... /index.html` answers any path
# with the homepage. That keeps deep links working if routes come back, and
# the rel=canonical tag in index.html tells search engines they are all one
# page.

server {
    listen 80;
    listen [::]:80;
    server_name danmesko.com;

    # Cloudflare's "Always Use HTTPS" upgrades at the edge first; this only
    # catches requests that reach the origin directly.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name danmesko.com;

    # Cloudflare Origin CA cert, valid 15 years and trusted only by Cloudflare.
    # If the DNS records are ever switched to DNS-only, browsers will reject it
    # and this needs a Let's Encrypt cert instead.
    ssl_certificate     /etc/ssl/cloudflare/danmesko.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/danmesko.com.key;

    root /var/www/website;
    index index.html;

    # Hashed asset filenames change whenever content changes, so they are safe
    # to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or visitors keep loading the old app
    # shell and pointing it at asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
