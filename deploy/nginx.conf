# Nginx config for the static build in `dist/`.
#
# The one rule that matters is `try_files ... /index.html`. Because this is a
# single-page app, only `/index.html` exists on disk -- URLs like
# /work/engineering are resolved by JavaScript in the browser. Without the
# fallback, those routes 404 on refresh or when someone follows a direct link.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Serve everything over HTTPS. Point this at your cert (certbot writes
    # these paths for you) and delete this redirect block if you terminate
    # TLS upstream instead.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/website;
    index index.html;

    # Hashed asset filenames change whenever content changes, so they are safe
    # to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or visitors keep loading the old app
    # shell and pointing it at asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
